    <title>TallyBard — collections copilot for people who sell on credit</title>
    <meta name="description" content="Open-source, self-hostable collections copilot. Predicts which receivables will be paid late and drafts polite WhatsApp nudges in the client's language. You approve everything — nothing sends itself." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)" />
    <!-- build.mjs rewrites this from WEB_API_URL / WEB_DEMO_MODE; no secrets live here -->
    <meta name="tallybard-config" content='{"apiUrl":"http://localhost:4111","demoMode":true,"repoUrl":"https://github.com/SayemR0018/tallyBard"}' />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
