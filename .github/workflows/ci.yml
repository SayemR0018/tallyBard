name: CI

on:
  push:
  pull_request:

jobs:
  risk-sidecar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r apps/risk-sidecar/requirements.txt

      - name: Compile check
        run: python -m py_compile apps/risk-sidecar/main.py
