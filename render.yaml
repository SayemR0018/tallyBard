# TallyBard — Render Blueprint (https://docs.render.com/blueprint-spec)
#
# Three services:
#   1. tallybard-web      — static site + zero-login demo SPA (apps/web/dist)
#   2. tallybard-api      — Mastra API (TypeScript, Node 24)
#   3. tallybard-sidecar  — FastAPI + TabPFN risk scorer (Python 3.12)
#
# Secrets are declared with `sync: false` and no values — paste them once in
# the Render dashboard when applying the blueprint.
#
# Sidecar RAM note (measured 2026-10-16):
#   Local TabPFN-3.5 (PyTorch + safetensors weights) peaks at ~2.26 GB RSS warm.
#   Render's Free (512 MB), Starter (512 MB), and Standard (2 GB) tiers will OOM
#   under `TABPFN_MODE=local`. Either keep `plan: pro` (4 GB) or switch
#   `TABPFN_MODE=api` with a Prior Labs token (`TABPFN_TOKEN`) on a smaller tier.

services:
  - type: web
    name: tallybard-web
    runtime: static
    buildCommand: node apps/web/build.mjs
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: WEB_API_URL
        value: https://tallybard-api.onrender.com
      - key: WEB_DEMO_MODE
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://tallybard-api.onrender.com http://localhost:4111; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tallybard-api
    runtime: node
    plan: starter
    rootDir: apps/api
    buildCommand: npm ci && npx mastra build
    startCommand: node --import=./.mastra/output/instrument.mjs .mastra/output/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4111"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_RW
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: MODEL_BACKEND
        value: aistudio # flip to ollama when the self-hosted droplet is up
      - key: AI_CHAT_MODEL
        value: gemma-4-26b-a4b-it
      - key: AI_EMBED_MODEL
        value: gemini-embedding-001
      - key: RISK_SIDECAR_URL
        value: https://tallybard-sidecar.onrender.com
      - key: WEB_ORIGIN
        value: https://tallybard-web.onrender.com
      - key: SENTRY_ENV
        value: production

  - type: web
    name: tallybard-sidecar
    runtime: python
    plan: pro # measured 2026-10-16: ~2.26 GB RSS warm (torch + TabPFN-3.5); <=2 GB tiers OOM in local mode
    rootDir: apps/risk-sidecar
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL # read-only DSN — sidecar never writes
        sync: false
      - key: TABPFN_MODE
        value: local
      - key: TABPFN_TAG
        value: tabpfn35
      - key: TABPFN_TOKEN
        sync: false
